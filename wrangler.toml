name = "vpn-shop-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# --- KV Namespaces ---
# Create these with:
#   npx wrangler kv namespace create BOT_KV
#   npx wrangler kv namespace create BOT_SESSIONS
# then paste the returned ids below.
kv_namespaces = [
  { binding = "BOT_KV", id = "REPLACE_WITH_BOT_KV_ID" },
  { binding = "BOT_SESSIONS", id = "REPLACE_WITH_BOT_SESSIONS_ID" }
]

# --- Secrets (set with `npx wrangler secret put NAME`, do NOT put real values here) ---
# BOT_TOKEN          -> Telegram bot token from @BotFather
# WEBHOOK_SECRET     -> random string, used to verify Telegram calls
# OWNER_ID           -> your numeric Telegram user id (first Owner admin)

[vars]
# Non-secret defaults (safe to keep in this file)
BOT_NAME = "VPN Shop Bot"
