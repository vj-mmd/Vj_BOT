name = "vpn-shop-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

--- KV Namespaces ---

kv_namespaces = [
{ binding = "BOT_KV", id = "2dc3b08851bf4d86b542cb1334b8381d" },
{ binding = "BOT_SESSIONS", id = "c52b2e299f194abfb106edcddeb3aa55" }
]

--- Secrets ---

Set these using:

npx wrangler secret put BOT_TOKEN

npx wrangler secret put WEBHOOK_SECRET

npx wrangler secret put OWNER_ID

[vars]
BOT_NAME = "Vj"
BOT_USERNAME = "Vj_PANEL_BOT"

Periodic expiry reminders / cleanup

[triggers]
crons = ["*/15 * * * *"]

--- Durable Object for serialized wallet operations / short locks ---

[[durable_objects.bindings]]
name = "WALLET_LOCK"
class_name = "WalletLock"

SQLite-backed Durable Object migration

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalletLock"]

--- Optional online gateway configuration ---

PUBLIC_BASE_URL = "https://your-worker.example.com"

ZARINPAL_MERCHANT_ID must be stored as a secret.

ZARINPAL_SANDBOX = "true" for sandbox testing.
